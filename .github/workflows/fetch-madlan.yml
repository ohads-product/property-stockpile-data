name: Fetch Madlan Private Listings

on:
  schedule:
    - cron: '10 * * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Fetch and filter listings
        run: |
          node << 'EOF'
          const https = require('https');
          const fs   = require('fs');

          const TARGETS = ['פלורנטין', 'הצפון-החדש', 'הצפון-הישן', 'כרם-התימנים'];

          function getNeighborhood(b) {
            const ids = (b.structuredAddress?.relevantDocIds || []).map(r => r.docId);
            for (const id of ids) {
              if (id.includes('פלורנטין'))      return 'פלורנטין';
              if (id.includes('הצפון-החדש'))    return 'הצפון החדש';
              if (id.includes('הצפון-הישן'))    return 'הצפון הישן';
              if (id.includes('כרם-התימנים'))   return 'כרם התימנים';
            }
            return null;
          }

          const QUERY = `
            query search($q: SearchBulletinQueryInput!) {
              searchBulletinWithUserPreferences(searchQuery: $q) {
                total
                bulletins {
                  id price area floor floors beds sellerType
                  address
                  structuredAddress { streetName relevantDocIds { docId type } }
                  firstTimeSeen
                  description
                }
              }
            }
          `;

          function fetchPage(offset) {
            return new Promise((resolve, reject) => {
              const body = JSON.stringify({
                query: QUERY,
                variables: {
                  q: {
                    offset,
                    limit: 400,
                    sortType: 'DATE',
                    sortOrder: 'DESC',
                    userPreferences: {}
                  }
                }
              });
              const req = https.request({
                hostname: 'www.madlan.co.il',
                path: '/api3',
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'Accept': 'application/json',
                  'User-Agent': 'Mozilla/5.0',
                  'Content-Length': Buffer.byteLength(body)
                }
              }, res => {
                let data = '';
                res.on('data', chunk => data += chunk);
                res.on('end', () => {
                  if (res.statusCode !== 200) {
                    reject(new Error(`HTTP ${res.statusCode}: ${data.slice(0, 300)}`));
                    return;
                  }
                  try { resolve(JSON.parse(data)); }
                  catch (e) { reject(new Error('JSON parse error: ' + data.slice(0, 200))); }
                });
              });
              req.on('error', reject);
              req.write(body);
              req.end();
            });
          }

          async function main() {
            const collected = [];
            const now = new Date();

            for (let offset = 0; offset < 2000; offset += 400) {
              console.log(`Fetching offset ${offset}...`);
              const result = await fetchPage(offset);

              if (result.errors) {
                console.error('GraphQL errors:', JSON.stringify(result.errors));
                if (offset === 0) process.exit(1);
                break;
              }

              const bulletins = result.data?.searchBulletinWithUserPreferences?.bulletins || [];
              if (bulletins.length === 0) { console.log('No more bulletins.'); break; }

              const matching = bulletins.filter(b => {
                if (b.sellerType !== 'private') return false;
                return TARGETS.some(t =>
                  (b.structuredAddress?.relevantDocIds || []).some(r => r.docId.includes(t))
                );
              });

              console.log(`  ${bulletins.length} fetched, ${matching.length} private+neighborhood`);
              collected.push(...matching);
            }

            console.log(`Total: ${collected.length} private listings in target neighborhoods`);

            if (collected.length === 0) {
              console.error('ERROR: no matching listings found');
              process.exit(1);
            }

            const updatedAt =
              now.getUTCHours().toString().padStart(2,'0') + ':' +
              now.getUTCMinutes().toString().padStart(2,'0') + ' UTC';

            const listings = collected.map(b => {
              const firstSeen = b.firstTimeSeen ? new Date(b.firstTimeSeen) : now;
              const daysAgo   = Math.max(0, Math.floor((now - firstSeen) / 86400000));
              const floor      = parseInt(b.floor) || 0;
              const totalFloors = parseInt(b.floors) || 0;
              const rooms      = b.beds || 0;
              const size       = Math.round(b.area || 0);
              const price      = b.price || 0;
              const pricePerSqm = size > 0 ? Math.round(price / size) : 0;
              const neighborhood = getNeighborhood(b) || 'אחר';

              return {
                id: b.id,
                neighborhood,
                area: b.structuredAddress?.streetName || b.address || '',
                size,
                rooms,
                floor,
                totalFloors,
                price,
                pricePerSqm,
                daysAgo,
                heatLevel: 'none',
                heatCount: 0,
                agentRevealCount: 0,
                madadStatus: 'at',
                exclusiveStatus: null,
                contactRevealed: false,
                ownerName: null,
                ownerPhone: null,
                desc: b.description || '',
                imageUrl: null
              };
            });

            listings.sort((a, b) => a.daysAgo - b.daysAgo);

            fs.writeFileSync('feed.json', JSON.stringify({ updatedAt, listings }, null, 2));
            console.log(`Written feed.json: ${listings.length} listings, updatedAt ${updatedAt}`);
          }

          main().catch(err => { console.error(err.message); process.exit(1); });
          EOF

          - name: Commit feed.json
            run: |
              git config user.email ...
              git config user.name ...
              git add feed.json
              if ! git diff --staged --quiet; then
                git commit -m "chore: refresh private listings feed"
                git push
              else
                echo "No changes to commit."
              fi
